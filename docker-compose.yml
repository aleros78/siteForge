version: '3.8'

networks:
  siteforge_internal:
    driver: bridge
  traefik_public:
    external: true
    name: traefik_public

volumes:
  mariadb_data:
    driver: local
  redis_data:
    driver: local

services:

  # ─── Traefik (reverse proxy globale) ────────────────────────────────────────
  traefik:
    image: traefik:v3.3
    container_name: siteforge_traefik
    restart: unless-stopped
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"   # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./docker/traefik/dynamic:/etc/traefik/dynamic:ro
      - ./docker/traefik/certs:/etc/traefik/certs
      - ./docker/traefik/acme.json:/etc/traefik/acme.json
    networks:
      - traefik_public
      - siteforge_internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.${APP_DOMAIN:-localhost}`)"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.entrypoints=web"

  # ─── MariaDB ────────────────────────────────────────────────────────────────
  mariadb:
    image: mariadb:11.2
    container_name: siteforge_mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-siteforge_root}
      MYSQL_DATABASE: ${DB_DATABASE:-siteforge}
      MYSQL_USER: ${DB_USERNAME:-siteforge}
      MYSQL_PASSWORD: ${DB_PASSWORD:-siteforge_pass}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - siteforge_internal
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── Redis (cache + queue future) ───────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: siteforge_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - siteforge_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ─── PHP-FPM App ────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
    container_name: siteforge_app
    restart: unless-stopped
    working_dir: /var/www
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://siteforge.localhost}
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-siteforge}
      DB_USERNAME: ${DB_USERNAME:-siteforge}
      DB_PASSWORD: ${DB_PASSWORD:-siteforge_pass}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      PROJECTS_BASE_PATH: ${PROJECTS_BASE_PATH:-/opt/siteforge/projects}
      DOCKER_SOCKET: /var/run/docker.sock
    volumes:
      - ./src:/var/www
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PROJECTS_BASE_PATH:-/opt/siteforge/projects}:${PROJECTS_BASE_PATH:-/opt/siteforge/projects}
      - ./templates:/opt/siteforge/templates
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - siteforge_internal
    labels:
      - "traefik.enable=false"

  # ─── Nginx ──────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: siteforge_nginx
    restart: unless-stopped
    volumes:
      - ./src:/var/www:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - siteforge_internal
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_public"
      - "traefik.http.routers.siteforge.rule=Host(`${APP_DOMAIN:-siteforge.localhost}`)"
      - "traefik.http.routers.siteforge.entrypoints=web"
      - "traefik.http.services.siteforge.loadbalancer.server.port=80"

  # ─── Queue Worker ────────────────────────────────────────────────────────────
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
    container_name: siteforge_queue
    restart: unless-stopped
    working_dir: /var/www
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=300"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:-}
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-siteforge}
      DB_USERNAME: ${DB_USERNAME:-siteforge}
      DB_PASSWORD: ${DB_PASSWORD:-siteforge_pass}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      PROJECTS_BASE_PATH: ${PROJECTS_BASE_PATH:-/opt/siteforge/projects}
      DOCKER_SOCKET: /var/run/docker.sock
    volumes:
      - ./src:/var/www
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PROJECTS_BASE_PATH:-/opt/siteforge/projects}:${PROJECTS_BASE_PATH:-/opt/siteforge/projects}
      - ./templates:/opt/siteforge/templates
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - siteforge_internal

  # ─── Scheduler ───────────────────────────────────────────────────────────────
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
    container_name: siteforge_scheduler
    restart: unless-stopped
    working_dir: /var/www
    command: ["/bin/sh", "-c", "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:-}
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-siteforge}
      DB_USERNAME: ${DB_USERNAME:-siteforge}
      DB_PASSWORD: ${DB_PASSWORD:-siteforge_pass}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      PROJECTS_BASE_PATH: ${PROJECTS_BASE_PATH:-/opt/siteforge/projects}
    volumes:
      - ./src:/var/www
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - siteforge_internal
